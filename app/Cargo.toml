[package]
name = "canstudio"
description = "CAN bus tool suite: DBC editor, log viewer, plotting, live SocketCAN, diagnostics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
dbc.workspace = true
canbus.workspace = true
serde.workspace = true
log.workspace = true
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11"] }
egui_plot = "0.37"
egui_dock = { version = "0.21", features = ["serde"] }
egui_extras = "0.36"
rfd = "0.17"
chrono = "0.4"
env_logger = "0.11"

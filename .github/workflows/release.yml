# Linux release: push a tag like `v0.1.0` (matching the workspace version) to
# build .deb, AppImage and tar.gz for x86_64 and aarch64 and publish them as a
# GitHub Release. Run manually (workflow_dispatch) to only build the artifacts.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # linuxdeploy is itself an AppImage; runners have no FUSE.
  APPIMAGE_EXTRACT_AND_RUN: "1"

jobs:
  build:
    name: build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 = glibc 2.35, so binaries run on Debian 12+, Ubuntu 22.04+, Fedora 36+.
          - { arch: x86_64, runner: ubuntu-22.04 }
          - { arch: aarch64, runner: ubuntu-22.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != Cargo.toml v$version"; exit 1; }

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config file libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libgl1-mesa-dev libegl1-mesa-dev

      - name: Rust toolchain (from rust-toolchain.toml)
        run: |
          command -v rustup || curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" show active-toolchain || "$HOME/.cargo/bin/rustup" toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.arch }}

      - name: Test
        run: cargo test --workspace --locked

      - name: Package (.deb, AppImage)
        env:
          CANSTUDIO_GIT_SHA: ${{ github.sha }}
        run: |
          export CANSTUDIO_GIT_SHA=${CANSTUDIO_GIT_SHA::7}
          cargo install cargo-packager --locked --version 0.11.8
          cargo packager --release -p canstudio

      - name: Tarball and checksums
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          name=canstudio-$version-${{ matrix.arch }}-linux
          mkdir -p dist "$name"
          cp target/release/canstudio README.md docs/logo.svg "$name/"
          tar czf "dist/$name.tar.gz" "$name"
          cp target/packages/*.deb target/packages/*.AppImage dist/
          cd dist && sha256sum * > SHA256SUMS-${{ matrix.arch }}.txt && ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: canstudio-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

[workspace]
resolver = "3"
members = ["crates/dbc", "crates/canbus", "app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.95"

[workspace.dependencies]
dbc = { path = "crates/dbc" }
canbus = { path = "crates/canbus" }
serde = { version = "1", features = ["derive"] }
log = "0.4"

[profile.release]
debug = 1

[profile.dev.package."*"]
opt-level = 2
